# Full-stack V2 for deployment (e.g. Raspberry Pi 5): Postgres + backend +
# frontend (nginx). Dev is unchanged — it still uses the DB-only
# docker-compose.yml plus `npm run dev`.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Reads .env for API keys + LLM/Alpaca config. Two values are overridden
# below because the .env defaults are host-oriented:
#   - DATABASE_URL points at localhost in .env, which is wrong inside a
#     container; here it targets the in-network `postgres` service.
#   - ENABLE_SCHEDULER defaults on for the deployed appliance.
#
# The named volume resolves to `v2_cf_v2_pgdata` (same project prefix as the
# DB-only compose), so this stack reuses the existing cycle data.
services:
  postgres:
    image: postgres:16-alpine
    container_name: capitalforge-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: capitalforge_v2
    ports:
      - "5432:5432"   # host access for remote DB tools (DBeaver/TablePlus/psql); exposed on all interfaces
    volumes:
      - cf_v2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capitalforge_v2"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: capitalforge-v2-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/capitalforge_v2?schema=public"
      PORT: "4000"
      ENABLE_SCHEDULER: "${ENABLE_SCHEDULER:-true}"
    ports:
      - "4000:4000"   # direct API / Swagger access (optional; nginx also proxies /api)
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: capitalforge-v2-frontend
    restart: unless-stopped
    ports:
      - "4001:80"     # dashboard at http://<host>:4001
    depends_on:
      - backend

volumes:
  cf_v2_pgdata:
