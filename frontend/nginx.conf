server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: unknown paths fall back to index.html so a deep
    # link like /cycles/123 doesn't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxied to the backend service on the compose network. `backend` is
    # the compose service name; :4000 is the Fastify port.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # growthScout / any LLM-backed endpoint can be slow
    }

    # Swagger UI (optional convenience).
    location /docs {
        proxy_pass http://backend:4000/docs;
        proxy_set_header Host $host;
    }
}
