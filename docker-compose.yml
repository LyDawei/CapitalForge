services:
  postgres:
    image: postgres:16-alpine
    container_name: capitalforge-db
    environment:
      POSTGRES_USER: capitalforge
      POSTGRES_PASSWORD: capitalforge
      POSTGRES_DB: capitalforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capitalforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: capitalforge-engine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://capitalforge:capitalforge@postgres:5432/capitalforge?schema=public
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TRADING_SYMBOLS: ${TRADING_SYMBOLS:-SPY}
      ALLOCATED_CAPITAL: ${ALLOCATED_CAPITAL:-2000}
      POSITION_SIZE_PCT: ${POSITION_SIZE_PCT:-0.2}
      MAX_DRAWDOWN_PCT: ${MAX_DRAWDOWN_PCT:-0.2}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-35 9 * * 1-5}
      MODE: ${MODE:-mock}
      ENGINE_VERSION: ${ENGINE_VERSION:-v1}
    volumes:
      - ./logs:/app/logs

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: capitalforge-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://capitalforge:capitalforge@postgres:5432/capitalforge?schema=public
      API_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3001"

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: capitalforge-ui
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
