# V2 Agent Audit Console — database only.
#
# Deliberately NOT a full-stack compose. The backend (:4000) and frontend
# (:4001) still run locally via `npm run dev`; only Postgres is containerized
# so the data lives in a managed volume instead of a local Postgres install.
#
#   docker compose up -d        # start the DB
#   docker compose down         # stop it (data persists in the named volume)
#   docker compose down -v      # stop AND wipe the volume (destroys all cycles)
#
# Credentials + db name match V2/.env's DATABASE_URL:
#   postgresql://postgres:<POSTGRES_PASSWORD>@localhost:5432/capitalforge_v2
#
# NOTE: host port 5432 must be free. If a local Postgres service is bound to
# it, stop that service first (see README/handoff), or change the host side of
# the port mapping below to e.g. "5434:5432" and update DATABASE_URL to match.
services:
  postgres:
    image: postgres:16-alpine
    container_name: capitalforge-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in V2/.env}
      POSTGRES_DB: capitalforge_v2
    ports:
      - "5432:5432"
    volumes:
      - cf_v2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capitalforge_v2"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cf_v2_pgdata:
