version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: capitalforge-db
    environment:
      POSTGRES_USER: capitalforge
      POSTGRES_PASSWORD: capitalforge
      POSTGRES_DB: capitalforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capitalforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: capitalforge-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://capitalforge:capitalforge@postgres:5432/capitalforge?schema=public
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TRADING_SYMBOL: ${TRADING_SYMBOL:-SPY}
      ALLOCATED_CAPITAL: ${ALLOCATED_CAPITAL:-200}
      POSITION_SIZE_PCT: ${POSITION_SIZE_PCT:-0.2}
      MAX_DRAWDOWN_PCT: ${MAX_DRAWDOWN_PCT:-0.2}
      LLM_MODEL: ${LLM_MODEL:-claude-3-5-sonnet-20241022}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-35 9 * * 1-5}
      MODE: ${MODE:-mock}
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
